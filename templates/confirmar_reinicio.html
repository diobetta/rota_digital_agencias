<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar reinício | Rota Digital para Agências</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar-sistema">
        <div class="container sistema-largura d-flex align-items-center justify-content-between">
            <div class="marca-sistema d-flex align-items-center gap-3">
                <div class="logo-sistema">R</div>
                <strong>Rota Digital para Agências</strong>
            </div>
        </div>
    </header>
    <main class="container sistema-largura confirmacao-area py-5">
        <section class="confirmacao-card mx-auto text-center"> <!-- Card de confirmação: Esta tela existe para evitar que o usuário perca respostas por acidente -->
            <div class="icone-confirmacao">
                ↩
            </div>
            <h1>Deseja voltar para o início?</h1>
            <p>
                Seu progresso atual ainda não foi finalizado. Ao voltar para o início,
                as respostas deste diagnóstico serão apagadas.
            </p>
            <!-- Botões de decisão -->
            <div class="d-flex flex-column flex-md-row gap-3 mt-4">
                <!-- Este botão chama a rota reiniciar: No app.py, essa rota usa session.clear() e volta para o index -->
                <a href="{{ url_for('reiniciar') }}" class="btn btn-alerta flex-fill">Voltar para o início</a>
                <!-- Este botão volta para a pergunta atual sem apagar a session. -->
                <a href="{{ url_for('diagnostico') }}" class="btn btn-secundario flex-fill">Continuar respondendo</a>
            </div>
        </section>
    </main>
</body>
</html>
